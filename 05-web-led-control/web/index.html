<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontrol LED IoT</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f2f2f2;
        margin-top: 80px;
      }

      h2 {
        color: #222;
      }

      p {
        color: #555;
      }

      .ip-info {
        display: inline-block;
        padding: 10px 16px;
        font-size: 16px;
        color: #333;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        padding: 12px 25px;
        margin: 10px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .connect {
        background-color: #1e66d0;
      }

      .on {
        background-color: green;
      }

      .off {
        background-color: red;
      }
    </style>
  </head>

  <body>
    <h2>Control LED ESP8266</h2>

    <p>Praktikum Pemrograman IoT</p>

    <div>
      <span class="ip-info">IP ESP: <b id="ip">-</b></span>
      <button class="connect" id="btnConnect">Hubungkan</button>
    </div>

    <button class="on" id="btnOn">LED ON</button>
    <button class="off" id="btnOff">LED OFF</button>

    <p id="status">Status: belum terhubung</p>

    <script src="script.js"></script>
  </body>
</html>
